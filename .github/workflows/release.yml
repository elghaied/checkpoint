name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Zip extension
        run: cd dist && zip -r ../checkpoint-${{ github.ref_name }}.zip .
      - name: Extract tag message
        id: tag_message
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          # Fetch full annotated tag objects
          git fetch --tags --force
          # Extract the body of the annotated tag (skip the first subject line)
          BODY=$(git for-each-ref "$TAG_REF" --format='%(contents:body)')
          if [ -z "$BODY" ]; then
            # Fallback: use full contents
            BODY=$(git for-each-ref "$TAG_REF" --format='%(contents)')
          fi
          {
            echo "body<<RELEASE_EOF"
            echo "$BODY"
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: checkpoint-${{ github.ref_name }}.zip
          body: ${{ steps.tag_message.outputs.body }}
